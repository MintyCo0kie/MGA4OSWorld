# Default MGA Configuration

environment:
  provider_name: docker
  path_to_vm: null
  region: us-east-1
  headless: true
  screen_width: 1920
  screen_height: 1080
  action_space: pyautogui
  observation_type: screenshot
  sleep_after_execution: 3.0
  client_password: ""

agent:
  model: MGA1
  max_tokens: 4096
  temperature: 1.0
  top_p: 0.9
  max_steps: 30
  max_trajectory_length: 3

experiment:
  domain: all
  test_config_base_dir: evaluation_examples
  test_all_meta_path: evaluation_examples/test_all.json
  result_dir: ./results
  num_envs: 1

logging:
  log_level: INFO
  log_dir: logs
  enable_file_logging: true
  enable_console_logging: true
